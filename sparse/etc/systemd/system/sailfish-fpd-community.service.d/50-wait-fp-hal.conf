# Our fingerprint HAL (android.hardware.biometrics.fingerprint@2.3-service.miami)
# re-registers IBiometricsFingerprint/default over the Egistec one some seconds
# after boot. If fpd connects before that it talks to the stock HAL directly and
# UDFPS touch handling never runs. Egistec only registers 2.1, so wait for 2.3.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do /system/bin/lshal list 2>/dev/null | grep -q "fingerprint@2.3::IBiometricsFingerprint/default" && exit 0; sleep 1; done; exit 0'
